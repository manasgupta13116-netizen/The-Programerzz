<!DOCTYPE html>
<html>
  <head>
    <title>Contact me</title>
    
    <style>
      .Name{
        border: 1px solid #75767B;
        border-radius: 4px 4px;
        padding: 10px;
        width: 320px
      }
      .Submit{
        border: 1px solid #75767B;
        border-radius: 4px 4px;
        padding: 10px;
      }
    </style>
  </head>

<body>
  
<!Forms-->
  <div>
    <font size="7">Contact me</font><br><br>
    
    <font size="5" color="#515257" >Your Name</font><br><br>
    
   <div>
    <form>
      <input type="search"  class="Name" placeholder="Enter your Name"/>
    </form>
  </div><br>
  
  <div>
    
    <font size="5" color="#515257" >Your Email</font><br><br>
  </div>
  
  <div>
    <form>
      <input type="Email"  class="Name" placeholder="Enter your Email"/>
  </div><br>
  
  <div>
       
    <font size="5" color="#515257" >Your Phone Number</font><br><br>
    <form>
      <input type="number"  class="Name" placeholder="Enter your Phone Number"/>
  </div><br>
  
  <div>
    
    <font size="5" color="#515257" >Describe What you want to Contact me for here</font><br><br>
    
    
  <textarea type="text" class="Name" placeholder="Your message"></textarea>
  </div><br>
  
  <!Submit-->
  <div>
     <input type="Submit"  class="Submit"/>
  </div>
   
  
  <div>
    </form>
  </div>
  
  </div>
</body>

</html>
